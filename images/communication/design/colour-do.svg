<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 202" role="img" aria-labelledby="t d">
  <title id="t">Two colours and one accent</title>
  <desc id="d">A navy slide with white text; one orange accent marks the key number, so the eye goes straight to it.</desc>
  <rect x="0.5" y="0.5" width="359" height="201" rx="6" fill="#023452" stroke="#d5dde2"/>

  <text x="24" y="42" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Training in 2025</text>
  <text x="24" y="66" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="12" fill="#9bcbdd">Highlights from our Node</text>
  <text x="24" y="130" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="44" font-weight="800" fill="#f47d20">240</text>
  <text x="24" y="152" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="12" fill="#ffffff">researchers registered</text>
  <text x="200" y="118" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">12</text><text x="200" y="134" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="11" fill="#9bcbdd">courses</text>
  <text x="272" y="118" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">88%</text><text x="272" y="134" font-family="'Open Sans', Lato, Arial, sans-serif" font-size="11" fill="#9bcbdd">completed</text>
  <rect x="24" y="172" width="40" height="3" fill="#f47d20"/>
</svg>
