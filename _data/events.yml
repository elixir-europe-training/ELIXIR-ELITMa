- name: Node Data Management Strategy workshop
  startDate: 2023-06-28
  endDate: 2023-06-29
  description: >
    This hybrid edition introduced key Research Data Management concepts, tools and Node examples, including funder perspectives, roles and competences and approaches to assessing Node services. Participants used a structured portfolio template to reflect on their own Node context, services, gaps and next steps. The presentations, shared notes and Node portfolios became an important basis for later editions and for the current self-paced module.
    [Find out more](https://doi.org/10.5281/zenodo.10895080)
  location: Espoo, Finland
  related_pages:
