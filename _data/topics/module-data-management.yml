# Topics for the Data management examples - a controlled vocabulary.
# Each example has one topic in front matter (topics: [risks]).
# Every topic gets its own page (/dm-topic-<id>), generated by _plugins/topic_pages.rb:
# not in the sidebar, reached from the topic links on examples and the All examples page.
# One topic per orange box (Reflection or Exercise), in chapter order. title is a short form of the header.
# Every orange box has a topic, also before an example has it (its topic page then shows no examples yet).
# chapter / section: the chapter (page_id) and the header in it (heading id) the topic comes from.
# section_title is the exact header text. "Back to chapter" goes straight to that header.
# When a header is renamed, update section and section_title too.
# gaps-to-action is older than its title: keep the id, so addresses keep working.
prefix: dm
topics:
  - id: risks
    title: Risks
    description: What goes wrong when decisions are made case by case
    chapter: mod_dm_1
    section: reflection-risks-without-a-data-management-strategy
    section_title: "Reflection: risks without a data management strategy"
  - id: gaps-to-action
    title: Reason for starting
    description: What made the timing right, and what the strategy had to clarify
    chapter: mod_dm_1
