# Topics for the Data management examples - a controlled vocabulary.
# Each example lists its topics in front matter (topics: [gaps-to-action, who-to-involve]).
# Every topic gets its own page (/dm-topic-<id>), generated by _plugins/topic_pages.rb:
# not in the sidebar, reached from the topic links on examples and the All examples page.
# chapter / section: the chapter (page_id) and the section in it (heading id) the topic
# comes from - the topic page's "Back to chapter" link goes straight to that section.
prefix: dm
topics:
  - id: why-strategy
    title: Why strategy
    description: Why a data management strategy can be useful
    chapter: mod_dm_1
    section: why-a-data-management-strategy-matters
    section_title: Why a data management strategy matters
  - id: existing-work
    title: Existing work
    description: How existing activities, services or policies can be connected
    chapter: mod_dm_1
    section: quick-exercise-starting-your-strategy        # to confirm with Mijke
    section_title: "Quick exercise: starting your strategy"
  - id: starting-point
    title: Starting point
    description: How to understand the current situation
    chapter: mod_dm_1
    section: quick-reflection-risks-without-a-data-management-strategy   # to confirm with Mijke
    section_title: "Quick reflection: risks without a data management strategy"
  - id: gaps-to-action
    title: Gaps to action
    description: How gaps or unclear areas can lead to next steps
    chapter: mod_dm_1
    section: exercise-define-your-reason-for-starting     # to confirm with Mijke
    section_title: "Exercise: define your reason for starting"
  - id: who-to-involve
    title: Who to involve
    description: Who needs to be part of the conversation
    chapter: mod_dm_1
    section: who-to-involve
    section_title: Who to involve
  - id: node-context
    title: Node context
    description: Why the Node context matters
    chapter: mod_dm_2
    section: why-the-node-context-matters
    section_title: Why the Node context matters
  - id: context-overview
    title: Context overview
    description: What to include in a first overview
    chapter: mod_dm_2
    section: building-a-context-overview
    section_title: Building a context overview
  - id: connections-and-gaps
    title: Connections and gaps
    description: What is connected, unclear or missing
    chapter: mod_dm_2
    section: quick-reflection-connections-and-gaps
    section_title: "Quick reflection: connections and gaps"
  - id: initial-team
    title: Initial team
    description: Who should be involved at the start
    chapter: mod_dm_2
    section: building-the-initial-team
    section_title: Building the initial team
  - id: ways-of-working
    title: Ways of working
    description: How to organise the work together
    chapter: mod_dm_2
    section: quick-exercise-planning-how-to-work-together
    section_title: "Quick exercise: planning how to work together"
