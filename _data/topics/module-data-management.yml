# Topics for the Data management examples - a controlled vocabulary.
# Each example lists its topics in front matter (topics: [gaps-to-action, who-to-involve]).
# Every topic gets its own page (/dm-topic-<id>), generated by _plugins/topic_pages.rb:
# not in the sidebar, reached from the topic links on examples and the All examples page.
# One topic per chapter header, in the order of the chapter. title is a short form of the header.
# chapter / section: the chapter (page_id) and the header in it (heading id) the topic comes from.
# section_title is the exact header text. "Back to chapter" goes straight to that header.
# Some ids are older than their titles (existing-work, gaps-to-action): keep the ids, so stories keep working.
prefix: dm
topics:
  - id: why-strategy
    title: Why strategy
    description: What a shared direction brings, and what often starts the work
    chapter: mod_dm_1
    section: why-a-data-management-strategy-matters
    section_title: Why a data management strategy matters
  - id: existing-work
    title: What a strategy does
    description: Connecting what already exists in a short, living document
    chapter: mod_dm_1
    section: what-a-data-management-strategy-is-and-does
    section_title: What a data management strategy is and does
  - id: risks
    title: Risks
    description: What goes wrong when decisions are made case by case
    chapter: mod_dm_1
    section: quick-reflection-risks-without-a-data-management-strategy
    section_title: "Quick reflection: risks without a data management strategy"
  - id: gaps-to-action
    title: Reason for starting
    description: What made the timing right, and what the strategy had to clarify
    chapter: mod_dm_1
    section: exercise-define-your-reason-for-starting
    section_title: "Exercise: define your reason for starting"
  - id: starting-point
    title: Starting point
    description: Taking stock of what is already there
    chapter: mod_dm_1
    section: quick-exercise-starting-your-strategy
    section_title: "Quick exercise: starting your strategy"
  - id: who-to-involve
    title: Who to involve
    description: Bringing different perspectives into a small group
    chapter: mod_dm_1
    section: who-to-involve
    section_title: Who to involve
  - id: node-context
    title: Node context
    description: Working in a network of partners with their own priorities
    chapter: mod_dm_2
    section: why-the-node-context-matters
    section_title: Why the Node context matters
  - id: context-overview
    title: Context overview
    description: Mapping what partners offer and where support is missing
    chapter: mod_dm_2
    section: building-a-context-overview
    section_title: Building a context overview
  - id: connections-and-gaps
    title: Connections and gaps
    description: Telling real gaps apart from things that are hard to find
    chapter: mod_dm_2
    section: quick-reflection-connections-and-gaps
    section_title: "Quick reflection: connections and gaps"
  - id: initial-team
    title: Initial team
    description: Starting with two or three people who see the work differently
    chapter: mod_dm_2
    section: building-the-initial-team
    section_title: Building the initial team
  - id: ways-of-working
    title: Ways of working
    description: Agreeing on a first meeting and keeping others involved
    chapter: mod_dm_2
    section: quick-exercise-planning-how-to-work-together
    section_title: "Quick exercise: planning how to work together"
